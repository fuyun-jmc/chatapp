<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>轻聊 · 界面预览（假数据）</title>
<link rel="stylesheet" href="assets/style.css">
<style>
  .preview-flag {
    position: absolute; right: 12px; bottom: 12px; z-index: 50;
    background: rgba(26,29,36,.82); color: #fff; font-size: 12px;
    padding: 5px 11px; border-radius: 8px;
  }
</style>
</head>
<body>

<section id="app-view" class="app-view">
  <aside class="sidebar">
    <header class="side-head">
      <div class="avatar" id="me-avatar">张</div>
      <div class="side-me">
        <div class="side-name">张伟</div>
        <div class="side-phone">13800138000</div>
      </div>
      <button class="icon-btn" type="button" aria-label="退出登录">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
      </button>
    </header>

    <div class="add-friend">
      <input type="tel" id="search-phone" inputmode="numeric" maxlength="11" placeholder="输入手机号添加好友">
      <button class="btn-mini" id="search-btn" type="button">搜索</button>
    </div>
    <div class="search-result" id="search-result" hidden></div>

    <div class="side-scroll">
      <div class="side-section" id="requests-section">
        <div class="side-title">新的好友 <span class="count" id="requests-count">1</span></div>
        <ul class="request-list" id="request-list"></ul>
      </div>
      <div class="side-section">
        <div class="side-title">好友</div>
        <ul class="friend-list" id="friend-list"></ul>
      </div>
    </div>
  </aside>

  <main class="chat">
    <div class="chat-empty" id="chat-empty" hidden>
      <div class="chat-empty-mark"></div>
      <p>选择一位好友开始聊天</p>
    </div>
    <div class="chat-room" id="chat-room">
      <header class="chat-head">
        <button class="icon-btn back-btn" id="back-btn" type="button" aria-label="返回">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <div class="avatar" id="peer-avatar">李</div>
        <div>
          <div class="chat-name" id="peer-name">李娜</div>
          <div class="chat-phone" id="peer-phone">13912345678</div>
        </div>
      </header>

      <div class="messages" id="messages"></div>

      <form class="composer" id="composer">
        <div class="attach-group">
          <button class="attach-btn" type="button" title="发送图片" aria-label="发送图片">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
          </button>
          <button class="attach-btn" type="button" title="发送视频" aria-label="发送视频">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="14" height="14" rx="3"/><path d="M16 10l6-3v10l-6-3z"/></svg>
          </button>
          <button class="attach-btn" type="button" title="发送文件" aria-label="发送文件">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.5L12.5 21a5 5 0 0 1-7-7l8.5-8.5a3.5 3.5 0 0 1 5 5L10.4 19.1a2 2 0 0 1-2.8-2.8l8-8"/></svg>
          </button>
        </div>
        <textarea id="msg-input" rows="1" placeholder="说点什么…"></textarea>
        <button class="send-btn" type="submit" aria-label="发送">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/></svg>
        </button>
      </form>
    </div>
  </main>
</section>

<div class="toast" id="toast" hidden></div>
<div class="preview-flag">界面预览 · 假数据，未连接后端</div>

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var COLORS = ['#4f7cf7', '#1d9e75', '#d85a30', '#7f77dd', '#d4537e', '#ba7517'];
  function colorOf(s) { var n = 0; s = String(s); for (var i = 0; i < s.length; i++) n = (n * 31 + s.charCodeAt(i)) >>> 0; return COLORS[n % COLORS.length]; }
  function el(t, c, x) { var n = document.createElement(t); if (c) n.className = c; if (x != null) n.textContent = x; return n; }
  function toast(m) { var t = $('toast'); t.textContent = m; t.hidden = false; clearTimeout(t._t); t._t = setTimeout(function () { t.hidden = true; }, 2200); }

  var PIC = 'data:image/svg+xml;utf8,' + encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" width="320" height="200">' +
    '<rect width="320" height="200" fill="#e6f1fb"/>' +
    '<circle cx="248" cy="52" r="24" fill="#fac775"/>' +
    '<path d="M0 150 L86 88 L150 138 L214 96 L320 168 L320 200 L0 200 Z" fill="#97c459"/>' +
    '<path d="M0 172 L70 128 L138 170 L200 140 L320 196 L320 200 L0 200 Z" fill="#639922"/>' +
    '</svg>');

  var friends = [
    { id: 'f1', nickname: '李娜', phone: '13912345678' },
    { id: 'f2', nickname: '王强', phone: '13687654321', unread: true },
    { id: 'f3', nickname: '陈晨', phone: '15801234567' }
  ];
  var requests = [{ id: 'r1', nickname: '刘洋', phone: '13500001111' }];

  var chats = {
    f1: [
      { out: false, kind: 'text', text: '周末爬山的照片发你了，看看这个角度', t: '09:12' },
      { out: false, kind: 'image', t: '09:12' },
      { out: true, kind: 'text', text: '拍得真好，天气也太给面子了', t: '09:15' },
      { out: false, kind: 'text', text: '下次一起去？我把路线整理成文档了', t: '09:16' },
      { out: false, kind: 'file', name: '爬山路线规划.pdf', size: '1.8 MB', t: '09:16' },
      { out: true, kind: 'text', text: '收到，我看看时间安排', t: '09:20' }
    ],
    f2: [
      { out: false, kind: 'text', text: '在吗？项目那个方案我改好了', t: '14:02' },
      { out: false, kind: 'file', name: '方案 v3.docx', size: '640 KB', t: '14:02' }
    ],
    f3: [
      { out: true, kind: 'text', text: '晚上一起吃饭？', t: '17:30' },
      { out: false, kind: 'text', text: '好啊，六点半老地方', t: '17:41' }
    ]
  };

  var active = friends[0];

  function renderRequests() {
    var list = $('request-list');
    list.innerHTML = '';
    $('requests-section').hidden = requests.length === 0;
    $('requests-count').textContent = requests.length;
    requests.forEach(function (r) {
      var li = el('li');
      var av = el('div', 'avatar sm', r.nickname.charAt(0));
      av.style.background = colorOf(r.phone);
      var info = el('div', 'info');
      info.appendChild(el('div', 'nm', r.nickname));
      info.appendChild(el('div', 'ph', r.phone.slice(0, 3) + '****' + r.phone.slice(7)));
      var ok = el('button', 'mini-ok', '同意');
      var no = el('button', 'mini-no', '拒绝');
      ok.onclick = function () {
        requests = requests.filter(function (x) { return x.id !== r.id; });
        friends.push({ id: r.id, nickname: r.nickname, phone: r.phone });
        chats[r.id] = [];
        renderRequests(); renderFriends(); toast('已添加为好友');
      };
      no.onclick = function () {
        requests = requests.filter(function (x) { return x.id !== r.id; });
        renderRequests(); toast('已拒绝');
      };
      li.appendChild(av); li.appendChild(info); li.appendChild(ok); li.appendChild(no);
      list.appendChild(li);
    });
  }

  function renderFriends() {
    var list = $('friend-list');
    list.innerHTML = '';
    friends.forEach(function (f) {
      var li = el('li');
      if (active && active.id === f.id) li.classList.add('is-active');
      var av = el('div', 'avatar sm', f.nickname.charAt(0));
      av.style.background = colorOf(f.phone);
      var info = el('div', 'info');
      info.appendChild(el('div', 'nm', f.nickname));
      info.appendChild(el('div', 'ph', f.phone));
      li.appendChild(av); li.appendChild(info);
      if (f.unread) li.appendChild(el('div', 'dot'));
      li.onclick = function () { f.unread = false; open(f); };
      list.appendChild(li);
    });
  }

  function bubbleFor(m) {
    var wrap = el('div', 'msg ' + (m.out ? 'out' : 'in'));
    var b;
    if (m.kind === 'image') {
      b = el('div', 'bubble media');
      var img = document.createElement('img');
      img.src = PIC; img.alt = '图片';
      b.appendChild(img);
    } else if (m.kind === 'file') {
      b = el('div', 'bubble');
      var card = el('div', 'file-card');
      card.appendChild(el('div', 'file-icon', (m.name.split('.').pop() || '').slice(0, 4)));
      var meta = el('div', 'file-meta');
      meta.appendChild(el('div', 'file-name', m.name));
      meta.appendChild(el('div', 'file-size', m.size));
      card.appendChild(meta);
      b.appendChild(card);
    } else {
      b = el('div', 'bubble', m.text);
    }
    wrap.appendChild(b);
    wrap.appendChild(el('div', 'msg-time', m.t));
    return wrap;
  }

  function open(f) {
    active = f;
    renderFriends();
    document.querySelector('.app-view').classList.add('show-chat');
    $('peer-name').textContent = f.nickname;
    $('peer-phone').textContent = f.phone;
    var av = $('peer-avatar');
    av.textContent = f.nickname.charAt(0);
    av.style.background = colorOf(f.phone);

    var box = $('messages');
    box.innerHTML = '';
    var list = chats[f.id] || [];
    if (!list.length) box.appendChild(el('div', 'day-sep', '还没有消息，打个招呼吧'));
    else box.appendChild(el('div', 'day-sep', '今天'));
    list.forEach(function (m) { box.appendChild(bubbleFor(m)); });
    box.scrollTop = box.scrollHeight;
  }

  $('composer').addEventListener('submit', function (e) {
    e.preventDefault();
    var v = $('msg-input').value.trim();
    if (!v) return;
    $('msg-input').value = '';
    $('msg-input').style.height = 'auto';
    var d = new Date();
    var m = { out: true, kind: 'text', text: v, t: String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0') };
    (chats[active.id] = chats[active.id] || []).push(m);
    var box = $('messages');
    var sep = box.querySelector('.day-sep');
    if (sep && sep.textContent.indexOf('打个招呼') > -1) sep.textContent = '今天';
    box.appendChild(bubbleFor(m));
    box.scrollTop = box.scrollHeight;
  });

  $('msg-input').addEventListener('input', function () {
    this.style.height = 'auto';
    this.style.height = Math.min(this.scrollHeight, 120) + 'px';
  });
  $('msg-input').addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey && window.innerWidth > 720) { e.preventDefault(); $('composer').requestSubmit(); }
  });

  $('back-btn').onclick = function () { document.querySelector('.app-view').classList.remove('show-chat'); };

  $('search-btn').onclick = function () {
    var p = $('search-phone').value.trim();
    var box = $('search-result');
    box.hidden = false; box.innerHTML = '';
    if (!/^1[3-9]\d{9}$/.test(p)) { box.appendChild(el('div', 'note', '请输入正确的 11 位手机号')); return; }
    var row = el('div', 'row');
    var av = el('div', 'avatar sm', '赵');
    av.style.background = colorOf(p);
    var info = el('div', 'info');
    info.appendChild(el('div', 'nm', '赵敏'));
    info.appendChild(el('div', 'ph', p));
    var add = el('button', 'btn-mini', '加为好友');
    add.style.padding = '6px 12px';
    add.onclick = function () { toast('好友申请已发送'); };
    row.appendChild(av); row.appendChild(info); row.appendChild(add);
    box.appendChild(row);
  };

  var meAv = $('me-avatar');
  meAv.style.background = colorOf('13800138000');
  renderRequests();
  renderFriends();
  open(friends[0]);
})();
</script>
</body>
</html>
